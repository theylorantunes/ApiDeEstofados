spring.application.name=perfumaria
spring.datasource.url=jdbc:h2:mem:perfumariadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/documentacao
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/api-docs


springdoc.swagger-ui.syntax-highlight.theme=monokai
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Carrega o CSS personalizado no Swagger
springdoc.swagger-ui.config-url=/swagger-config
springdoc.swagger-ui.css-url=/swagger-custom.css